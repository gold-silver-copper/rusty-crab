[package]
name = "rusty-crab"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"

[build-dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
sha2 = "0.10"


